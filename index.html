<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 관리 시스템</title>
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 20px; }
    
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #e0e0e0; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 16px; }
    .tab-btn.active { background: #4A90E2; color: white; }
    
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 5px; }
    .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .form-group input[type="text"] { flex: 2; min-width: 120px; }
    .form-group input[type="month"] { flex: 1.5; min-width: 130px; }
    .form-group select { flex: 1; min-width: 100px; }
    .btn-add { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
    th { background: #f1f1f1; }
    
    .paused { background-color: #ffe6e6; color: #d9534f; text-decoration: line-through; }
    .btn-status { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; }
    .btn-active { background: #17a2b8; color: white; }
    .btn-pause { background: #ffc107; color: #333; }
    .btn-del { background: #dc3545; color: white; margin-left: 5px; }
    
    .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); color:white; justify-content:center; align-items:center; font-size:20px; font-weight:bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 학생 관리 시스템</h1>
  
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('1관')">1관</button>
    <button class="tab-btn" onclick="switchTab('2관')">2관</button>
  </div>

  <div class="form-group">
    <input type="text" id="stuName" placeholder="이름">
    <input type="text" id="stuGrade" placeholder="학년">
    <select id="stuLevel">
      <option value="Lv1-A">Lv1-A</option>
      <option value="Lv1-B">Lv1-B</option>
      <option value="Lv2-A">Lv2-A</option>
      <option value="Lv2-B">Lv2-B</option>
      <option value="Lv3-A">Lv3-A</option>
    </select>
    <input type="month" id="stuDate">
    <button class="btn-add" onclick="addStudent()">등록</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>이름</th>
        <th>학년</th>
        <th>레벨</th>
        <th>시작월</th>
        <th>상태 및 관리</th>
      </tr>
    </thead>
    <tbody id="studentList"></tbody>
  </table>
</div>

<div id="loading" class="loading-overlay">데이터 동기화 중...</div>

<script>
  // 배포된 구글 앱 스크립트 URL 자동 적용 완료
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycqF6zHX0eYXfQd594fMyXgR8dIP0fhQepipMqSgZ8htZNKseEFqHNLhaPAasVHwq6/exec";
  
  let currentTab = '1관';
  let db = { '1관': [], '2관': [] };

  window.onload = function() {
    loadData();
  };

  function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'flex' : 'none';
  }

  function loadData() {
    showLoading(true);
    fetch(GOOGLE_SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        db = data;
        render();
        showLoading(false);
      })
      .catch(err => {
        alert("데이터 불러오기 실패: 구글 시트 상태 또는 네트워크를 확인해주세요.");
        console.error(err);
        showLoading(false);
      });
  }

  function saveData() {
    showLoading(true);
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(db)
    })
    .then(res => res.text())
    .then(() => {
      showLoading(false);
      render();
    })
    .catch(err => {
      alert("저장 실패");
      console.error(err);
      showLoading(false);
    });
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    render();
  }

  function render() {
    const list = document.getElementById('studentList');
    list.innerHTML = '';
    
    const students = db[currentTab] || [];
    
    students.forEach((st, idx) => {
      const tr = document.createElement('tr');
      if (st.isPaused) tr.classList.add('paused');
      
      tr.innerHTML = `
        <td>${st.name}</td>
        <td>${st.grade}</td>
        <td>${st.levelRaw}</td>
        <td>${st.levelStartDate}</td>
        <td>
          <button class="btn-status ${st.isPaused ? 'btn-active' : 'btn-pause'}" onclick="togglePause(${idx})">
            ${st.isPaused ? '재원' : '휴원'}
          </button>
          <button class="btn-status btn-del" onclick="deleteStudent(${idx})">삭제</button>
        </td>
      `;
      list.appendChild(tr);
    });
  }

  function addStudent() {
    const name = document.getElementById('stuName').value.trim();
    const grade = document.getElementById('stuGrade').value.trim();
    const levelRaw = document.getElementById('stuLevel').value;
    const levelStartDate = document.getElementById('stuDate').value;

    if (!name) {
      alert("이름을 입력해주세요.");
      return;
    }

    db[currentTab].push({
      name, grade, levelRaw, levelStartDate, isPaused: false
    });

    document.getElementById('stuName').value = '';
    document.getElementById('stuGrade').value = '';
    
    saveData();
  }

  function togglePause(idx) {
    db[currentTab][idx].isPaused = !db[currentTab][idx].isPaused;
    saveData();
  }

  function deleteStudent(idx) {
    if (confirm("정말 삭제하시겠습니까?")) {
      db[currentTab].splice(idx, 1);
      saveData();
    }
  }
</script>

</body>
</html>
