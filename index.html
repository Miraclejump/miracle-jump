<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 관리 시스템</title>
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; margin-bottom: 20px; }
    
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #e0e0e0; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 16px; }
    .tab-btn.active { background: #4A90E2; color: white; }
    
    .form-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border-radius: 5px; align-items: center; }
    .form-group input, .form-group select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .form-group input[type="text"] { flex: 1.2; min-width: 90px; }
    .form-group input[type="month"] { flex: 1.2; min-width: 125px; }
    .btn-add { background: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    
    .bulk-action-bar { display: flex; justify-content: space-between; align-items: center; background: #e9ecef; padding: 10px 15px; border-radius: 5px; margin-bottom: 10px; }
    .bulk-btns { display: flex; gap: 6px; }

    table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    th, td { border: 1px solid #ddd; padding: 8px 5px; text-align: center; font-size: 13px; }
    th { background: #f1f1f1; }
    
    .paused { background-color: #ffe6e6; color: #d9534f; text-decoration: line-through; }
    .btn-sm { padding: 3px 6px; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .btn-step { background: #6c757d; color: white; margin: 0 1px; padding: 2px 6px; }
    .btn-step:hover { background: #495057; }
    .btn-active { background: #17a2b8; color: white; }
    .btn-pause { background: #ffc107; color: #333; }
    .btn-del { background: #dc3545; color: white; }
    
    .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); color:white; justify-content:center; align-items:center; font-size:20px; font-weight:bold; z-index: 1000; }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 학생 관리 시스템</h1>
  
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('1관', event)">1관</button>
    <button class="tab-btn" onclick="switchTab('2관', event)">2관</button>
  </div>

  <!-- 신규 등록 폼 -->
  <div class="form-group">
    <input type="text" id="stuName" placeholder="이름">
    <input type="text" id="stuGrade" placeholder="학년(예: 초3)">
    <select id="stuLevel">
      <option value="Lv1-A">Lv1-A</option>
      <option value="Lv1-B">Lv1-B</option>
      <option value="Lv2-A">Lv2-A</option>
      <option value="Lv2-B">Lv2-B</option>
      <option value="Lv3-A">Lv3-A</option>
      <option value="Lv3-B">Lv3-B</option>
    </select>
    <input type="month" id="stuDate">
    <button class="btn-add" onclick="addStudent()">등록</button>
  </div>

  <!-- 일괄 관리 기능 -->
  <div class="bulk-action-bar">
    <div>
      <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)">
      <label for="selectAll"><strong>전체 선택</strong></label>
    </div>
    <div class="bulk-btns">
      <button class="btn-sm btn-pause" onclick="bulkStatus(true)">선택 휴원</button>
      <button class="btn-sm btn-active" onclick="bulkStatus(false)">선택 재원</button>
      <button class="btn-sm btn-del" onclick="bulkDelete()">선택 삭제</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 30px;">선택</th>
        <th>표시 이름(초성)</th>
        <th>이름</th>
        <th>학년 (+/-)</th>
        <th>레벨 (+/-)</th>
        <th>시작월</th>
        <th>관</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="studentList"></tbody>
  </table>
</div>

<div id="loading" class="loading-overlay">데이터 동기화 중...</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycqF6zHX0eYXfQd594fMyXgR8dIP0fhQepipMqSgZ8htZNKseEFqHNLhaPAasVHwq6/exec";
  
  const LEVELS = ["Lv1-A", "Lv1-B", "Lv2-A", "Lv2-B", "Lv3-A", "Lv3-B"];
  let currentTab = '1관';
  let db = { '1관': [], '2관': [] };

  window.onload = function() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('stuDate').value = `${year}-${month}`;
    
    loadData();
  };

  function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'flex' : 'none';
  }

  // 초성 추출 함수 (1관 -> 1, 2관 -> 2 붙이기)
  function getDisplayName(name, tab) {
    const tag = (tab === '1관') ? '(1)' : '(2)';
    if (name.endsWith('(1)') || name.endsWith('(2)')) {
      return name;
    }
    return `${name}${tag}`;
  }

  function loadData() {
    showLoading(true);
    fetch(GOOGLE_SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        db = data;
        render();
        showLoading(false);
      })
      .catch(err => {
        alert("데이터 불러오기 실패");
        console.error(err);
        showLoading(false);
      });
  }

  function saveData() {
    showLoading(true);
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(db)
    })
    .then(res => res.text())
    .then(() => {
      showLoading(false);
      render();
    })
    .catch(err => {
      alert("저장 실패");
      console.error(err);
      showLoading(false);
    });
  }

  function switchTab(tab, evt) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    evt.target.classList.add('active');
    document.getElementById('selectAll').checked = false;
    render();
  }

  function render() {
    const list = document.getElementById('studentList');
    list.innerHTML = '';
    
    const students = db[currentTab] || [];
    
    students.forEach((st, idx) => {
      const tr = document.createElement('tr');
      if (st.isPaused) tr.classList.add('paused');
      
      const displayName = getDisplayName(st.name, currentTab);
      
      tr.innerHTML = `
        <td><input type="checkbox" class="stu-chk" data-idx="${idx}"></td>
        <td><strong>${displayName}</strong></td>
        <td>${st.name}</td>
        <td>
          <button class="btn-sm btn-step" onclick="changeGrade(${idx}, -1)">-</button>
          <span>${st.grade}</span>
          <button class="btn-sm btn-step" onclick="changeGrade(${idx}, 1)">+</button>
        </td>
        <td>
          <button class="btn-sm btn-step" onclick="changeLevel(${idx}, -1)">-</button>
          <span>${st.levelRaw}</span>
          <button class="btn-sm btn-step" onclick="changeLevel(${idx}, 1)">+</button>
        </td>
        <td>${st.levelStartDate}</td>
        <td>${currentTab}</td>
        <td>
          <button class="btn-sm ${st.isPaused ? 'btn-active' : 'btn-pause'}" onclick="togglePause(${idx})">
            ${st.isPaused ? '재원' : '휴원'}
          </button>
          <button class="btn-sm btn-del" onclick="deleteStudent(${idx})">삭제</button>
        </td>
      `;
      list.appendChild(tr);
    });
    
    document.getElementById('selectAll').checked = false;
  }

  function addStudent() {
    const name = document.getElementById('stuName').value.trim();
    const grade = document.getElementById('stuGrade').value.trim();
    const levelRaw = document.getElementById('stuLevel').value;
    const levelStartDate = document.getElementById('stuDate').value;

    if (!name) {
      alert("이름을 입력해주세요.");
      return;
    }

    db[currentTab].push({
      name, grade, levelRaw, levelStartDate, isPaused: false
    });

    document.getElementById('stuName').value = '';
    document.getElementById('stuGrade').value = '';
    saveData();
  }

  function changeGrade(idx, step) {
    let g = db[currentTab][idx].grade;
    const match = g.match(/([가-힣]+)(\d+)/);
    if (match) {
      const prefix = match[1];
      let num = parseInt(match[2]) + step;
      if (num < 1) num = 1;
      db[currentTab][idx].grade = `${prefix}${num}`;
    } else {
      let num = parseInt(g);
      if (!isNaN(num)) {
        db[currentTab][idx].grade = String(Math.max(1, num + step));
      }
    }
    saveData();
  }

  function changeLevel(idx, step) {
    let curLevel = db[currentTab][idx].levelRaw;
    let curIdx = LEVELS.indexOf(curLevel);
    if (curIdx === -1) curIdx = 0;
    
    let nextIdx = curIdx + step;
    if (nextIdx >= 0 && nextIdx < LEVELS.length) {
      db[currentTab][idx].levelRaw = LEVELS[nextIdx];
      
      // 레벨이 변경되면 시작월을 현재 연월로 업데이트
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      db[currentTab][idx].levelStartDate = `${y}-${m}`;
      
      saveData();
    }
  }

  function togglePause(idx) {
    db[currentTab][idx].isPaused = !db[currentTab][idx].isPaused;
    saveData();
  }

  function deleteStudent(idx) {
    if (confirm("정말 삭제하시겠습니까?")) {
      db[currentTab].splice(idx, 1);
      saveData();
    }
  }

  function toggleSelectAll(master) {
    document.querySelectorAll('.stu-chk').forEach(chk => chk.checked = master.checked);
  }

  function getSelectedIndices() {
    const chks = document.querySelectorAll('.stu-chk:checked');
    return Array.from(chks).map(c => parseInt(c.dataset.idx)).sort((a, b) => b - a);
  }

  function bulkStatus(isPaused) {
    const indices = getSelectedIndices();
    if (indices.length === 0) {
      alert("선택된 학생이 없습니다.");
      return;
    }
    indices.forEach(idx => {
      db[currentTab][idx].isPaused = isPaused;
    });
    saveData();
  }

  function bulkDelete() {
    const indices = getSelectedIndices();
    if (indices.length === 0) {
      alert("선택된 학생이 없습니다.");
      return;
    }
    if (confirm(`선택한 ${indices.length}명의 학생을 삭제하시겠습니까?`)) {
      indices.forEach(idx => {
        db[currentTab].splice(idx, 1);
      });
      saveData();
    }
  }
</script>

</body>
</html>
